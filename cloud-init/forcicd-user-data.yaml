#cloud-config
# forcicd.g8.lo — Fedora 43 cloud VM that hosts Forgejo + its
# Actions runner in a Docker Compose stack. Minimal cloud-init:
# just SSH + QGA + Docker. The compose stack and runner registration
# happen via SSH from scripts/install.sh + scripts/bootstrap.sh.

hostname: forcicd
fqdn: forcicd.g8.lo
prefer_fqdn_over_hostname: true

users:
  - name: fedora
    groups: [wheel, adm, systemd-journal, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  gwest@Glenns-MacBook-Pro.local

ssh_pwauth: false
package_update: false
packages:
  - qemu-guest-agent
runcmd:
  - [ systemctl, enable, --now, qemu-guest-agent ]
final_message: "forcicd.g8.lo cloud-init complete in $UPTIME seconds"
