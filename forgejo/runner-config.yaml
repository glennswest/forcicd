# forcicd runner config.
#
# The critical setting is container.network = forcicd_default —
# without it the per-job containers run on an isolated bridge
# network and can't reach forgejo:3000 (so actions/checkout fails
# with "Could not resolve host: forgejo"). Pointing them at the
# same compose network as forgejo + registry makes both reachable
# by service name from inside jobs.

log:
  level: info

runner:
  file: /data/.runner
  # Run several jobs concurrently — the VM has 12 vCPU / 32 GiB.
  # Each job is its own container; 4 leaves headroom for forgejo +
  # registry + dashboard and for cargo's own parallelism.
  capacity: 4
  timeout: 3h

container:
  # Attach per-job containers to the same docker network as
  # forgejo + forcicd-registry so jobs can `git fetch
  # http://forgejo:3000/...` and `docker pull
  # forcicd-registry:5000/...`.
  network: forcicd_default
  privileged: false
  # Per-job container options:
  #  --security-opt seccomp=unconfined : lets io_uring_setup through
  #    (Docker's default seccomp blocks it; fastetcd's `iouring`
  #    tests need it. Kernel has io_uring_disabled=0 on Fedora 43).
  #  --privileged : lets rootless podman/buildah create nested user
  #    namespaces inside the job container (newuidmap otherwise
  #    fails), so `podman build` / `pod` work in CI. Acceptable on
  #    this single-tenant trusted-LAN runner.
  #  --device /dev/fuse : fuse-overlayfs for nested overlay storage.
  options: "--privileged --security-opt seccomp=unconfined --device /dev/fuse"
  valid_volumes: []
  docker_host: ""
  force_pull: false
  force_rebuild: false

cache:
  enabled: true

host:
  workdir_parent: ""
