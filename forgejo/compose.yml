# Forgejo + Actions runner stack for forcicd.g8.lo.
#
# Forgejo (the server) and act_runner (Forgejo's GitHub-Actions-
# compatible job executor) run as separate services on a shared
# user-defined bridge network so the runner can reach the server
# at http://forgejo:3000 without touching host networking.
#
# The runner needs the Docker socket to launch per-job container
# environments. That's the standard act_runner pattern and is the
# reason we use Docker (not Podman) on the host.

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Wire the public web URL so generated links / clone URLs
      # resolve from the LAN.
      - FORGEJO__server__ROOT_URL=http://forcicd.g8.lo:3000/
      - FORGEJO__server__DOMAIN=forcicd.g8.lo
      - FORGEJO__server__SSH_DOMAIN=forcicd.g8.lo
      # The codeberg.org/forgejo image already binds OpenSSH on :22
      # inside the container, so we disable Forgejo's builtin SSH
      # server. Git operations go over HTTP, which is fine on the LAN.
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__server__START_SSH_SERVER=false
      # Allow GitHub-Actions-style external actions (actions/checkout etc.)
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=github
      # Mirror config: allow up to 1-minute pull intervals.
      - FORGEJO__cron.update_mirrors__SCHEDULE=@every 1m
      - FORGEJO__mirror__MIN_INTERVAL=1m
      # Skip the first-run install wizard — we drive setup via API
      # from scripts/bootstrap.sh. SQLite is fine for one repo;
      # swap to postgres if we ever scale this out.
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/data/gitea/forgejo.db
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=false
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # web UI / API + git over HTTP
      - "3000:3000"

  runner:
    image: code.forgejo.org/forgejo/runner:6
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      - forgejo
    # The image's default CMD is bare `forgejo-runner` (which just
    # prints --help). `bootstrap.sh` puts /data/.runner in place
    # first; we just need to launch the daemon against it.
    working_dir: /data
    command: ["/bin/forgejo-runner", "daemon"]
    volumes:
      - runner-data:/data
      # The runner launches per-job containers via the host docker
      # daemon. Mounting the socket is the standard act_runner
      # pattern. `:z` relabels for SELinux (Fedora 43 enforces).
      - /var/run/docker.sock:/var/run/docker.sock:z
    user: "0:0"
    # SELinux blocks unprivileged containers from talking to
    # docker.sock even when the file perms allow it. Disable the
    # confinement *just* for the runner — it already has root +
    # the docker socket, so this is no escalation in practice.
    security_opt:
      - label=disable

  registry:
    # Plain HTTP Docker registry v2. We tried fastregistry.g10.lo
    # first (mkube's existing registry) but its /data/registry/
    # uploads dir is missing — returns 500 on every push. Running a
    # local one here removes that dependency and keeps the whole
    # CI/CD loop on the forcicd VM.
    image: registry:2
    container_name: forcicd-registry
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "5000:5000"

  dashboard:
    # forcicd-specific ops view — VM/container health, runner
    # labels, CD drift. Lives next to Forgejo (which is the GUI
    # for everything else: code, runs, settings, mirror).
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: forcicd-dashboard:local
    container_name: forcicd-dashboard
    restart: unless-stopped
    depends_on:
      - forgejo
    environment:
      - FORGEJO_URL=http://forgejo:3000
      - FORGEJO_REPO=ci/fastetcd
      - FORGEJO_ADMIN_USER=ci
    volumes:
      - /etc/forcicd/admin-password:/etc/forcicd/admin-password:ro
      - /var/lib/forcicd:/var/lib/forcicd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    security_opt:
      - label=disable
    ports:
      - "8090:8090"

volumes:
  forgejo-data:
  runner-data:
  registry-data:
